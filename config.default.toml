sre_key = "ENABLE_MANUAL_FORMATION_LAP"
description = "Enter or leave manual formation lap mode. Call this at the start of a race with a rolling or formation start."

[[intents]]
id = "volume_up"
action = "Increase messages volume"
key = "ctrl+F19"
description = "Turn the crew chief's volume up. Call this when the driver says they cannot hear the chief."
phrases = [
  "turn the volume up",
  "i cant hear you",
  "increase the volume",
]

[[intents]]
id = "volume_down"
action = "Decrease messages volume"
