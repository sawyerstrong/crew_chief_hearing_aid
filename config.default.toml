# crew_chief_hearing_aid defaults. DO NOT EDIT — copy what you need into your
# own %APPDATA%\crew_chief_hearing_aid\config.toml, which is merged over this
# file at startup. Run `crew_chief_hearing_aid init-config` to create it.

[audio]
# Matched as a case-insensitive substring against enumerated input devices.
# Never a bare index: indices reshuffle across reboots and USB replugs, and this
# rig has four active microphones plus NVIDIA Broadcast's virtual endpoints.
# Run `crew_chief_hearing_aid devices` to list what is available.
input_device = "USB PnP Audio Device"
sample_rate = 16000
block_ms = 32
# Rolling audio kept before the trigger fires, so the first word is not clipped.
preroll_ms = 512
# Only used on the (disabled) wake-word path. PTT release is the endpoint.
silence_timeout_ms = 900
max_utterance_ms = 6000

[ptt]
# Push-to-talk on a wheel button. This is the only trigger in v1.
# Run `crew_chief_hearing_aid setup-ptt` to capture a button — it fills in
# device_guid and button_index for you.
enabled = true
device_guid = ""
button_index = -1
poll_hz = 60
# Ignore taps shorter than this; stops a fumbled press starting a transcription.
min_hold_ms = 120

[wakeword]
# Out of scope for v1 (D2). Always-on listening adds a false-positive surface
# (Discord, sim audio) and forces a ~900ms VAD timeout onto the critical path.
# PTT release endpoints directly, which is why the happy path is ~1.2s.
enabled = false
model = "hey_jarvis"
threshold = 0.55
cooldown_ms = 1500

[vad]
# Not needed for endpointing under PTT — button release is the endpoint.
enabled = false
threshold = 0.5

[asr]
# CPU, int8. This is load-bearing, not a default to tweak: the GPU is rendering
# VR at 90fps, and a CUDA context plus cuDNN kernels costs 300-600MB to run a
# 78MB model badly. `doctor` checks this and warns if it drifts.
model = "tiny.en"
device = "cpu"
compute_type = "int8"
beam_size = 1
initial_prompt = "Race engineer radio: lap time, gap, fuel, tyres, pit, sector, position, delta."

[intent]
embedder = "model2vec"
embedder_model = "minishlab/potion-base-8M"
# Tier 2 is IDF-weighted query coverage: how much of what you SAID is explained
# by the phrase. Asymmetric on purpose, opposite to containment.
token_threshold = 0.72
embed_threshold = 0.60
# Reject when the top two intents are this close, even at a high score.
margin = 0.05
# Absolute IDF mass required before a match counts. Stops a query of only common
# words ("what is my") being "fully covered" by any phrase containing them.
min_evidence = 2.0

[llm]
# Tier 4: consulted only when tiers 1-3 reject. Buys multi-intent and paraphrase
# headroom without putting the network on the critical path for common commands.
# Needs ANTHROPIC_API_KEY in the environment — never put a key in this file.
enabled = true
model = "claude-haiku-4-5"
timeout_s = 2.5
max_tokens = 512

[output]
# "keypress" needs no CrewChief changes — bind the keys below in Add/Remove
# Actions. "pipe" targets a forked CrewChief and is unsupported in v1.
# "log" is a dry run.
sink = "keypress"
pipe_name = "crewchief-voice"
# CrewChief polls controllers at hold_button_poll_frequency (100ms default),
# so anything under ~120ms can fall between polls and be missed entirely.
key_hold_ms = 150
# Gap between keypresses when one utterance resolves to several intents.
multi_intent_gap_ms = 250

[logging]
# Every utterance gets a JSONL record: transcript, chosen intent, score, tier,
# runner-up. This is the artifact for tuning — without it you cannot tell a bad
# transcript from a badly-tuned threshold.
dir = "logs"
level = "INFO"


# --- Actions -----------------------------------------------------------
#
# 27 entries: every action in CrewChief's Add/Remove Actions dialog except
# "Talk to Crew Chief", which is CrewChief's own push-to-talk and irrelevant
# here since we bypass its recogniser entirely.
#
# `action`      — the label in Add/Remove Actions. Bind it to `key` there.
# `description` — written for the LLM tier; says WHEN to call, not just what.
# `sre_key`     — entry in CrewChief's speech_recognition_config.txt to import
#                 phrases from. Absent for actions CrewChief exposes as a button
#                 but has no voice command for; those carry explicit `phrases`.
#
# F13–F24 have no physical keys, so nothing else on the system can ever emit
# them. 27 actions need more than 12, hence the Ctrl/Shift combos.

# ---- Race-critical: plain F13–F24 ----

[[intents]]
id = "car_ahead_last_lap"
action = "What's the car ahead's last lap time"
key = "F13"
description = "Report the last lap time set by the car directly ahead on track. Call this when the driver asks how fast the car in front is going or what it is lapping."
phrases = [
  "what is the car ahead's last lap time",
  "what's the guy in front running",
  "what is the car in front lapping",
  "how fast is the car ahead going",
  "car ahead lap time",
]

[[intents]]
id = "car_behind_last_lap"
action = "What's the car behind's last lap time"
key = "F14"
description = "Report the last lap time set by the car directly behind on track. Call this when the driver asks how fast the car behind is going or whether it is catching up."
phrases = [
  "what is the car behind's last lap time",
  "what's the guy behind running",
  "how fast is the car behind going",
  "car behind lap time",
]

[[intents]]
id = "fuel_status"
action = "Report fuel/battery status"
key = "F15"
sre_key = "HOWS_MY_FUEL"
description = "Report remaining fuel or battery and how many laps it covers. Call this for any question about fuel level, fuel usage, or whether the driver can make the end of the race."

[[intents]]
id = "car_damage"
action = "Report car damage"
key = "F16"
sre_key = "DAMAGE_REPORT"
description = "Report current car damage. Call this after contact, or when the driver asks whether the car is hurt, broken, or still okay."

[[intents]]
id = "car_status"
action = "Report car status and damage"
key = "F17"
sre_key = "CAR_STATUS"
description = "Report combined car condition — tyres, brakes, engine, and damage. Call this for a general 'how is the car' question rather than a damage-specific one."

[[intents]]
id = "session_status"
action = "Report session status"
key = "F18"
sre_key = "SESSION_STATUS"
description = "Report session position, laps or time remaining, and flags. Call this when the driver asks where they are in the race or how much is left."

[[intents]]
id = "full_status"
action = "Report car, damage and session status"
key = "F19"
sre_key = "STATUS"
description = "Full combined update: car, damage, and session. Call this when the driver asks for everything at once, or a general 'how am I doing'."

[[intents]]
id = "pit_prediction"
action = "Pit stop prediction"
key = "F20"
description = "Predict what track position the driver would rejoin in after pitting now. Call this when the driver is weighing whether to box."
phrases = [
  "what is the pit prediction",
  "where will i come out if i pit now",
  "what happens if i pit this lap",
  "pit prediction",
]

[[intents]]
id = "repeat_last_message"
action = "Press to replay the last message"
key = "F21"
sre_key = "REPEAT_LAST_MESSAGE"
description = "Replay the last thing the crew chief said. Call this when the driver missed a message or asks for it again."

[[intents]]
id = "toggle_mute"
action = "Toggle mute"
key = "F22"
sre_key = "KEEP_QUIET"
description = "Mute or unmute the crew chief. Call this when the driver wants silence to concentrate, or wants the chief talking again."

[[intents]]
id = "toggle_spotter"
action = "Toggle Spotter on/off"
key = "F23"
description = "Turn the spotter's car-alongside calls on or off. Call this when the driver mentions the spotter specifically."
phrases = [
  "turn the spotter off",
  "turn the spotter on",
  "toggle the spotter",
  "spotter off",
]

[[intents]]
id = "toggle_race_updates"
action = "Toggle race updates on/off"
key = "F24"
description = "Turn periodic race position and gap updates on or off. Call this when the driver wants fewer or more routine updates, without muting entirely."
phrases = [
  "turn race updates off",
  "turn race updates on",
  "toggle race updates",
  "stop the race updates",
]

