  "recentre the view",
  "reset the headset view",
]

[[intents]]
id = "toggle_track_landmark_recording"
action = "Start / stop track landmarks recording"
key = "ctrl+F24"
description = "Start or stop recording track landmarks. Call this only when the driver is explicitly building a landmark set."
phrases = [
  "start recording track landmarks",
