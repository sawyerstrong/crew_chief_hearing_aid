  "mark this landmark",
  "set a landmark here",
]

[[intents]]
id = "reset_vr_view"
action = "Reset VR view"
key = "ctrl+F23"
description = "Re-centre the VR headset view. Call this when the driver says their view is off-centre or asks to recentre."
phrases = [
