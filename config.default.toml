description = "Turn the crew chief's volume down. Call this when the driver says the chief is too loud."
phrases = [
  "turn the volume down",
  "youre too loud",
  "decrease the volume",
]

[[intents]]
id = "print_track_data"
action = "Print track and position info"
key = "ctrl+F21"
description = "Dump track and position debug information to the CrewChief console. Diagnostic — call only if the driver explicitly asks for track data or debug info."
