  "print track data",
  "print track and position info",
  "dump track info",
]

[[intents]]
id = "add_track_landmark"
action = "Add Start / end track landmark"
key = "ctrl+F22"
description = "Mark the start or end of a named track landmark at the current position. Call this only while the driver is explicitly recording landmarks."
phrases = [
