[project]
name = "crew_chief_hearing_aid"
version = "0.1.0"
description = "Local voice control for CrewChief V4 — wake word, Whisper ASR, semantic intent matching, synthetic keypress output."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # Round-trips the user config on write. A plain dict-dump would strip every
    # explanatory comment the first time setup touched the file.
    "tomlkit>=0.13",
]

[project.optional-dependencies]
# Everything needed to actually run on the rig. Split out so CI can install
# the core + test extras without pulling ONNX runtimes or audio backends.
runtime = [
    "sounddevice>=0.4.6",
    "onnxruntime>=1.17",
    "faster-whisper>=1.0.3",
    "model2vec>=0.3.0",
    # Wheel button push-to-talk. Only the joystick subsystem is initialised —
    # pygame.init() would also bring up video and can steal focus on Windows.
    "pygame>=2.5",
    # Tier 4 router. Optional at runtime: without ANTHROPIC_API_KEY the cascade
    # simply stops at tier 3.
    "anthropic>=0.40",
]
# Wake word is out of scope for v1 (D2) — install only if you re-enable it.
wakeword = [
    "openwakeword>=0.6.0",
]
# Optional heavier embedder. Only if model2vec's static embeddings prove
# insufficient for your phrasing — pulls torch (~2GB).
st = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
crew_chief_hearing_aid = "crew_chief_hearing_aid.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew_chief_hearing_aid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
